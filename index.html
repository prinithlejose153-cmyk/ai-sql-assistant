<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI SQL Assistant</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 700px;
    height: 600px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 12px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
}

.user {
    background: #22c55e;
    align-self: flex-end;
    color: black;
}

.ai {
    background: rgba(255,255,255,0.1);
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00ffcc, #0077ff);
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>AI SQL Assistant 🤖</h1>

    <div id="chat" class="chat"></div>

    <div class="input-area">
        <input id="query" placeholder="Ask your database..." />
        <button onclick="ask()">Send</button>
    </div>
</div>

<script>
async function ask() {
    const input = document.getElementById("query");
    const chat = document.getElementById("chat");
    const q = input.value;

    if (!q) return;

    chat.innerHTML += `<div class="message user">${q}</div>`;
    input.value = "";

    const id = Date.now();
    chat.innerHTML += `<div id="${id}" class="message ai">⏳ Thinking...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("https://ai-sql-assistant-z6xw.onrender.com/ask?q=" + encodeURIComponent(q));
        const data = await res.json();

        document.getElementById(id).innerHTML = `
            <b>SQL:</b><br>${data.sql}<br><br>
            <b>Result:</b><br>${JSON.stringify(data.result)}
        `;
    } catch (err) {
        document.getElementById(id).innerHTML = "❌ Backend error";
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI SQL Assistant</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 700px;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    color: white;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 32px;
}

.chat-box {
    max-height: 400px;
    overflow-y: auto;
    padding-right: 10px;
}

.message {
    padding: 14px;
    margin: 12px 0;
    border-radius: 12px;
    animation: fadeIn 0.3s ease-in;
}

.user {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    text-align: right;
}

.ai {
    background: rgba(255,255,255,0.08);
}

.input-box {
    display: flex;
    margin-top: 20px;
}

input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

button {
    margin-left: 10px;
    padding: 14px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #00ff87, #60efff);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

pre {
    white-space: pre-wrap;
    color: #00ffcc;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>AI SQL Assistant 🤖</h1>

    <div id="chat" class="chat-box"></div>

    <div class="input-box">
        <input id="query" placeholder="Ask your database..." />
        <button onclick="ask()">Send</button>
    </div>
</div>

<script>
async function ask() {
    const q = document.getElementById("query").value;
    const chat = document.getElementById("chat");

    if (!q) return;

    chat.innerHTML += `<div class="message user">${q}</div>`;

    const id = Date.now();
    chat.innerHTML += `<div id="${id}" class="message ai">⏳ Thinking...</div>`;

    document.getElementById("query").value = "";

    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch(`http://127.0.0.1:8000/ask?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        document.getElementById(id).innerHTML = `
            <b>SQL:</b><br>${data.sql}<br><br>
            <b>Result:</b><br>
            <pre>${JSON.stringify(data.result, null, 2)}</pre>
        `;

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        document.getElementById(id).innerHTML = "❌ Backend error";
    }
}
</script>

</body>
</html>

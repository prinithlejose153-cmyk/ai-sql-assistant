<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI SQL Assistant</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass card */
.container {
    width: 600px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
}

/* Chat area */
.chat {
    height: 350px;
    overflow-y: auto;
    margin-bottom: 15px;
}

/* Messages */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 10px;
}

.user {
    background: #22c55e;
    text-align: right;
    color: black;
}

.ai {
    background: rgba(255,255,255,0.1);
}

/* Input area */
.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    background: linear-gradient(135deg, #00f260, #0575e6);
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    transform: scale(1.05);
}

/* Loading */
.loading {
    opacity: 0.7;
    font-style: italic;
}
</style>
</head>

<body>

<div class="container">
    <h1>AI SQL Assistant 🤖</h1>

    <div id="chat" class="chat"></div>

    <div class="input-area">
        <input id="query" placeholder="Ask your database..." />
        <button onclick="ask()">Send</button>
    </div>
</div>

<script>
const chat = document.getElementById("chat");

async function ask() {
    const input = document.getElementById("query");
    const question = input.value;

    if (!question) return;

    // Show user message
    chat.innerHTML += `<div class="message user">${question}</div>`;

    input.value = "";

    // Loading message
    const loadingId = Date.now();
    chat.innerHTML += `<div id="${loadingId}" class="message ai loading">Thinking...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("https://ai-sql-assistant-z6xw.onrender.com/ask?q=" + encodeURIComponent(query))
        const data = await res.json();

        document.getElementById(loadingId).innerHTML = `
            <b>SQL:</b><br>${data.sql}<br><br>
            <b>Result:</b><br>${JSON.stringify(data.result, null, 2)}
        `;
    } catch (err) {
        document.getElementById(loadingId).innerHTML = "❌ Error connecting to backend";
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
